name: Build image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - server/**
      - public/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/swindlesmccoop/walltab:latest
            ghcr.io/swindlesmccoop/walltab:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
